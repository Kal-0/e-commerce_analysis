resources:
  jobs:
    silver_layer:
      name: silver_layer
      tasks:
        - task_key: silver_orders
          notebook_task:
            notebook_path: SRC/ETL/2.SILVER/silver_orders
            source: GIT
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        
        - task_key: silver_products_enriched
          notebook_task:
            notebook_path: SRC/ETL/2.SILVER/silver_products_enriched
            source: GIT
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        
        - task_key: silver_order_products
          depends_on:
            - task_key: silver_orders
          notebook_task:
            notebook_path: SRC/ETL/2.SILVER/silver_order_products
            source: GIT
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
      git_source:
        git_url: https://github.com/Kal-0/e-commerce_analysis.git
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED